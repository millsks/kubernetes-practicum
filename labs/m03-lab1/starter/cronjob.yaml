# cronjob.yaml: a scheduled task that never overlaps itself (see labs/m03-lab1/README.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: podinfo-report
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              command: ['sh', '-c', 'date; echo report done']
